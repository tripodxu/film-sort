name: CI
on:
  push:
    branches: [main, "docs/**"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --run
      - run: npm run build
      # 2026-10-30 验收 F1：五道门禁不含「本地 dev 能否启动」，单独冒烟
      - run: npm run dev:smoke
